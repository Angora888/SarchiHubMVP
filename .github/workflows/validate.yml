name: Validate API and frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build RestaurantHub.Api/RestaurantHub.Api.csproj --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: restauranthub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: restauranthub-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
